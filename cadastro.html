<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyExecutive | Criar Conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="brand-title">SkyExecutive</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="login.html">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="logo-badge">
        <div class="icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ECF0F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
        <span class="badge-text">Sky<em>Executive</em></span>
      </div>

      <h2>Crie a sua conta</h2>

      <form class="form-container">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="confirmar-senha">Confirmar senha</label>
          <input type="password" id="confirmar-senha" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
      </form>

      <div class="auth-footer">
        <p>Já tem uma conta? <a href="login.html">Entre</a></p>
      </div>
    </section>
  </main>

  <footer class="main-footer">
    <div class="footer-container">
      <p>&copy; 2026 SkyExecutive. Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
</html>
