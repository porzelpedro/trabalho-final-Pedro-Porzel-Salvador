<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyExecutive | Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="brand-title">SkyExecutive</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="reservar.html">Reservar Voo</a></li>
          <li><a href="cadastro.html" class="nav-btn">Criar Conta</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="logo-badge">
        <div class="icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ECF0F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
        <span class="badge-text">Sky<em>Executive</em></span>
      </div>

      <h2>Entrar na sua conta</h2>

      <form class="form-container">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-password">
            <input type="password" id="senha" placeholder="••••••••" required>
            <button type="button" class="btn-toggle-pass" aria-label="Mostrar senha">👁️</button>
          </div>
        </div>

        <div class="form-options">
          <a href="#" class="forgot-link">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <div class="auth-footer">
        <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
      </div>
    </section>
  </main>

  <footer class="main-footer">
    <div class="footer-container">
      <p>&copy; 2026 SkyExecutive. Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
</html>
